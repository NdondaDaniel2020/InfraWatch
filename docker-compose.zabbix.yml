services:
  zabbix-db:
    image: postgres:16-alpine
    container_name: infrawatch-zabbix-db
    restart: always
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD_FILE: /run/secrets/zabbix_db_password
    volumes:
      - zabbix_db_data:/var/lib/postgresql/data
    networks:
      - infrawatch-zabbix-net
    secrets:
      - zabbix_db_password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U zabbix -d zabbix" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: infrawatch-zabbix-server
    restart: always
    ports:
      - "10051:10051"
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD_FILE: /run/secrets/zabbix_db_password
    secrets:
      - zabbix_db_password
    depends_on:
      zabbix-db:
        condition: service_healthy
    networks:
      - infrawatch-zabbix-net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: infrawatch-zabbix-web
    restart: always
    ports:
      - "8081:8080"
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD_FILE: /run/secrets/zabbix_db_password
      PHP_TZ: Africa/Luanda
    secrets:
      - zabbix_db_password
    depends_on:
      zabbix-db:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    networks:
      - infrawatch-zabbix-net

  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    container_name: infrawatch-zabbix-agent
    restart: always
    ports:
      - "10050:10050"
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: zabbix-server
      ZBX_PASSIVE_ALLOW: "true"
    depends_on:
      - zabbix-server
    networks:
      - infrawatch-zabbix-net

secrets:
  zabbix_db_password:
    file: ./secrets/zabbix_db_password.txt

volumes:
  zabbix_db_data:
    driver: local

networks:
  infrawatch-zabbix-net:
    driver: bridge
