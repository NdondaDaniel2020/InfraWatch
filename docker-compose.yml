services:
  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: infrawatch-postgres
    restart: always
    env_file:
      - ./backend/.env.production
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrawatch_user} -d ${POSTGRES_DB:-infrawatch_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    secrets:
      - postgres_password
    networks:
      - infrawatch-net

  redis:
    image: redis:7.4-alpine
    container_name: infrawatch-redis
    restart: always
    command: [ "/bin/sh", "-c", "redis-server --appendonly yes --requirepass $$(cat /run/secrets/redis_password)" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $$(cat /run/secrets/redis_password) ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    secrets:
      - redis_password
    networks:
      - infrawatch-net

  infrawatch-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: infrawatch-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.production
    secrets:
      - postgres_password
      - redis_password
      - secret_key
      - refresh_secret_key
      - oauth_state_secret
      - mfa_pending_secret
      - smtp_password
      - google_client_id
      - google_client_secret
      - admin_email
      - admin_password
      - glpi_app_token
      - glpi_user_token
      - zabbix_api_url
      - zabbix_api_token
      - zabbix_password
      - zabbix_webhook_secret
      - telegram_bot_token
      - telegram_chat_id
      - whatsapp_token
      - whatsapp_gateway_url
      - default_webhook_url
      - prometheus_metrics_user
      - prometheus_metrics_pass
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infrawatch-net

  infrawatch-docker-proxy:
    image: tecnativa/docker-socket-proxy:0.1.1
    container_name: infrawatch-docker-proxy
    restart: always
    environment:
      # Politica Zero-Trust: desativa todos os metodos com mutacao ou operacoes perigosas
      POST: 0
      DELETE: 0
      PUT: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
      SECRETS: 0
      # Habilita apenas operacoes de leitura estritamente necessarias para monitoramento
      CONTAINERS: 1
      INFO: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - infrawatch-net

  infrawatch-probe-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: infrawatch-probe-worker
    restart: always
    command: [ "python", "-m", "src.workers.daemons.probe_worker" ]
    env_file:
      - ./backend/.env.production
    secrets:
      - postgres_password
      - redis_password
      - secret_key
      - refresh_secret_key
      - oauth_state_secret
      - mfa_pending_secret
      - smtp_password
      - google_client_id
      - google_client_secret
      - admin_email
      - admin_password
      - glpi_app_token
      - glpi_user_token
      - zabbix_api_url
      - zabbix_api_token
      - zabbix_password
      - telegram_bot_token
      - telegram_chat_id
      - whatsapp_token
      - whatsapp_gateway_url
      - default_webhook_url
      - prometheus_metrics_user
      - prometheus_metrics_pass
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      infrawatch-docker-proxy:
        condition: service_started
    networks:
      - infrawatch-net

  infrawatch-integration-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: infrawatch-integration-worker
    restart: always
    command: [ "python", "-m", "src.workers.daemons.integration_worker" ]
    env_file:
      - ./backend/.env.production
    secrets:
      - postgres_password
      - redis_password
      - secret_key
      - refresh_secret_key
      - oauth_state_secret
      - mfa_pending_secret
      - smtp_password
      - google_client_id
      - google_client_secret
      - admin_email
      - admin_password
      - glpi_app_token
      - glpi_user_token
      - zabbix_api_url
      - zabbix_api_token
      - zabbix_password
      - telegram_bot_token
      - telegram_chat_id
      - whatsapp_token
      - whatsapp_gateway_url
      - default_webhook_url
      - prometheus_metrics_user
      - prometheus_metrics_pass
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infrawatch-net

  infrawatch-outbox-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: infrawatch-outbox-worker
    restart: always
    command: [ "python", "-m", "src.workers.daemons.outbox_relay_worker" ]
    env_file:
      - ./backend/.env.production
    secrets:
      - postgres_password
      - redis_password
      - secret_key
      - refresh_secret_key
      - oauth_state_secret
      - mfa_pending_secret
      - smtp_password
      - google_client_id
      - google_client_secret
      - admin_email
      - admin_password
      - glpi_app_token
      - glpi_user_token
      - zabbix_api_url
      - zabbix_api_token
      - zabbix_password
      - telegram_bot_token
      - telegram_chat_id
      - whatsapp_token
      - whatsapp_gateway_url
      - default_webhook_url
      - prometheus_metrics_user
      - prometheus_metrics_pass
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infrawatch-net

  infrawatch-cleanup-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: infrawatch-cleanup-worker
    restart: always
    command: [ "python", "-m", "src.workers.daemons.token_cleanup_worker" ]
    env_file:
      - ./backend/.env.production
    secrets:
      - postgres_password
      - redis_password
      - secret_key
      - refresh_secret_key
      - oauth_state_secret
      - mfa_pending_secret
      - smtp_password
      - google_client_id
      - google_client_secret
      - admin_email
      - admin_password
      - glpi_app_token
      - glpi_user_token
      - zabbix_api_url
      - zabbix_api_token
      - zabbix_password
      - telegram_bot_token
      - telegram_chat_id
      - whatsapp_token
      - whatsapp_gateway_url
      - default_webhook_url
      - prometheus_metrics_user
      - prometheus_metrics_pass
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infrawatch-net

  infrawatch-zabbix-sync-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: infrawatch-zabbix-sync-worker
    restart: always
    command: [ "python", "-m", "src.workers.daemons.zabbix_sync_worker" ]
    env_file:
      - ./backend/.env.production
    secrets:
      - postgres_password
      - redis_password
      - secret_key
      - refresh_secret_key
      - oauth_state_secret
      - mfa_pending_secret
      - smtp_password
      - google_client_id
      - google_client_secret
      - admin_email
      - admin_password
      - glpi_app_token
      - glpi_user_token
      - zabbix_api_url
      - zabbix_api_token
      - zabbix_password
      - telegram_bot_token
      - telegram_chat_id
      - whatsapp_token
      - whatsapp_gateway_url
      - default_webhook_url
      - prometheus_metrics_user
      - prometheus_metrics_pass
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infrawatch-net

  infrawatch-whatsapp-gateway:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: infrawatch-whatsapp-gateway
    restart: always
    profiles:
      - whatsapp
    ports:
      - "8085:8085"
    entrypoint:
      - "/bin/sh"
      - "-c"
      - >
        export AUTHENTICATION_API_KEY=$$(cat /run/secrets/whatsapp_token 2>/dev/null || echo "$$AUTHENTICATION_API_KEY");
        PG_PASS=$$(cat /run/secrets/postgres_password 2>/dev/null);
        REDIS_PASS=$$(cat /run/secrets/redis_password 2>/dev/null);
        export DATABASE_CONNECTION_URI="postgresql://${POSTGRES_USER:-infrawatch_user}:$${PG_PASS}@postgres:5432/${POSTGRES_DB:-infrawatch_db}?schema=evolution";
        export CACHE_REDIS_URI="redis://:$${REDIS_PASS}@redis:6379/6";
        exec npm run start:prod
    environment:
      SERVER_PORT: 8085
      SERVER_URL: http://localhost:8085
      DATABASE_PROVIDER: postgresql
      CACHE_REDIS_ENABLED: "true"
    secrets:
      - whatsapp_token
      - postgres_password
      - redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - infrawatch-net

  infrawatch-backup:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.backup
    container_name: infrawatch-backup
    restart: always
    env_file:
      - ./backend/.env.production
    volumes:
      - ./scripts:/app/scripts:ro
      - backup_data:/var/backups/infrawatch
    secrets:
      - postgres_password
      - redis_password
      - backup_encryption_key
      - rclone_config
      - google_client_id
      - google_client_secret
      - telegram_bot_token
      - telegram_chat_id
      - default_webhook_url
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infrawatch-net

  infrawatch-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infrawatch-frontend
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - infrawatch-net

  infrawatch-gateway:
    image: nginx:1.27-alpine
    container_name: infrawatch-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      infrawatch-frontend:
        condition: service_healthy
      infrawatch-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - infrawatch-net

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  secret_key:
    file: ./secrets/secret_key.txt
  refresh_secret_key:
    file: ./secrets/refresh_secret_key.txt
  oauth_state_secret:
    file: ./secrets/oauth_state_secret.txt
  mfa_pending_secret:
    file: ./secrets/mfa_pending_secret.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
  google_client_id:
    file: ./secrets/google_client_id.txt
  google_client_secret:
    file: ./secrets/google_client_secret.txt
  admin_email:
    file: ./secrets/admin_email.txt
  admin_password:
    file: ./secrets/admin_password.txt
  glpi_app_token:
    file: ./secrets/glpi_app_token.txt
  glpi_user_token:
    file: ./secrets/glpi_user_token.txt
  zabbix_api_url:
    file: ./secrets/zabbix_api_url.txt
  zabbix_api_token:
    file: ./secrets/zabbix_api_token.txt
  zabbix_password:
    file: ./secrets/zabbix_password.txt
  zabbix_webhook_secret:
    file: ./secrets/zabbix_webhook_secret.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  telegram_chat_id:
    file: ./secrets/telegram_chat_id.txt
  whatsapp_token:
    file: ./secrets/whatsapp_token.txt
  whatsapp_gateway_url:
    file: ./secrets/whatsapp_gateway_url.txt
  default_webhook_url:
    file: ./secrets/default_webhook_url.txt
  prometheus_metrics_user:
    file: ./secrets/prometheus_metrics_user.txt
  prometheus_metrics_pass:
    file: ./secrets/prometheus_metrics_pass.txt
  backup_encryption_key:
    file: ./secrets/backup_encryption_key.txt
  rclone_config:
    file: ./secrets/rclone_config.txt

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  evolution_instances:
    driver: local
  backup_data:
    driver: local

networks:
  infrawatch-net:
    driver: bridge

