services:
  postgres:
    image: postgres:16-alpine
    container_name: infrawatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infrawatch_db}
      POSTGRES_USER: ${POSTGRES_USER:-infrawatch_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrawatch_user} -d ${POSTGRES_DB:-infrawatch_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    secrets:
      - postgres_password
    networks:
      - infrawatch-net

  redis:
    image: redis:7-alpine
    container_name: infrawatch-redis
    restart: unless-stopped
    command: ["/bin/sh", "-c", "redis-server --appendonly yes --requirepass $$(cat /run/secrets/redis_password)"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$(cat /run/secrets/redis_password) ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    secrets:
      - redis_password
    networks:
      - infrawatch-net

  infrawatch-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: infrawatch-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-infrawatch_db}
      POSTGRES_USER: ${POSTGRES_USER:-infrawatch_user}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVIRONMENT: ${ENVIRONMENT:-development}
    secrets:
      - postgres_password
      - redis_password
      - secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infrawatch-net

  infrawatch-probe-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: infrawatch-probe-worker
    restart: unless-stopped
    command: ["python", "-m", "src.workers.daemons.probe_worker"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-infrawatch_db}
      POSTGRES_USER: ${POSTGRES_USER:-infrawatch_user}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVIRONMENT: ${ENVIRONMENT:-development}
    secrets:
      - postgres_password
      - redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infrawatch-net

  infrawatch-integration-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: infrawatch-integration-worker
    restart: unless-stopped
    command: ["python", "-m", "src.workers.integration_worker"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-infrawatch_db}
      POSTGRES_USER: ${POSTGRES_USER:-infrawatch_user}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVIRONMENT: ${ENVIRONMENT:-development}
    secrets:
      - postgres_password
      - redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infrawatch-net

  infrawatch-outbox-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: infrawatch-outbox-worker
    restart: unless-stopped
    command: ["python", "-m", "src.workers.daemons.outbox_relay_worker"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-infrawatch_db}
      POSTGRES_USER: ${POSTGRES_USER:-infrawatch_user}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVIRONMENT: ${ENVIRONMENT:-development}
    secrets:
      - postgres_password
      - redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infrawatch-net

  infrawatch-cleanup-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: infrawatch-cleanup-worker
    restart: unless-stopped
    command: ["python", "-m", "src.workers.daemons.token_cleanup_worker"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-infrawatch_db}
      POSTGRES_USER: ${POSTGRES_USER:-infrawatch_user}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVIRONMENT: ${ENVIRONMENT:-development}
    secrets:
      - postgres_password
      - redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infrawatch-net

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: infrawatch-whatsapp-gateway
    restart: unless-stopped
    ports:
      - "8085:8085"
    entrypoint: ["/bin/sh", "-c", "export AUTHENTICATION_API_KEY=$$(cat /run/secrets/whatsapp_token 2>/dev/null || echo \"$$AUTHENTICATION_API_KEY\"); exec npm run start:prod"]
    environment:
      SERVER_URL: http://localhost:8085
    secrets:
      - whatsapp_token
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - infrawatch-net

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  secret_key:
    file: ./secrets/secret_key.txt
  whatsapp_token:
    file: ./secrets/whatsapp_token.txt

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  evolution_instances:
    driver: local

networks:
  infrawatch-net:
    driver: bridge
