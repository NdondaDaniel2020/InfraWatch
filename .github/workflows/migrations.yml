name: Migrations

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migration checks & Hardening
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      POSTGRES_DB: infrawatch_db
      POSTGRES_USER: infrawatch_user
      POSTGRES_PASSWORD: infrawatch_secure_password_2026
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://infrawatch_user:infrawatch_secure_password_2026@127.0.0.1:5432/infrawatch_db
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: test-secret-key-32-characters-minimum-length-for-hmac
      REFRESH_SECRET_KEY: test-refresh-secret-key-32-characters-minimum

    services:
      postgres:
        image: timescale/timescaledb:2.16.1-pg16
        env:
          POSTGRES_USER: infrawatch_user
          POSTGRES_PASSWORD: infrawatch_secure_password_2026
          POSTGRES_DB: infrawatch_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infrawatch_user -d infrawatch_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Cache dependencies
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync --frozen --all-extras --group dev

      - name: Prepare database & verify readiness
        run: |
          sudo systemctl stop postgresql.service || true
          sudo systemctl disable postgresql.service || true
          which pg_isready || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U infrawatch_user -d infrawatch_db; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Verify single migration head
        run: uv run alembic heads

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Verify Hardening Audit Script against Postgres
        run: |
          which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          PGPASSWORD=infrawatch_secure_password_2026 psql -h 127.0.0.1 -U infrawatch_user -d infrawatch_db < scripts/audit_database_hardening.sql

      - name: Rollback to previous revision and re-apply
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head
