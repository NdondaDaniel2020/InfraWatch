name: Smoke Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test API & Health
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      POSTGRES_DB: infrawatch_db
      POSTGRES_USER: infrawatch_user
      POSTGRES_PASSWORD: infrawatch_secure_password_2026
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://infrawatch_user:infrawatch_secure_password_2026@127.0.0.1:5432/infrawatch_db
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: smoke-test-secret-key-32-characters-minimum-for-hmac
      REFRESH_SECRET_KEY: smoke-test-refresh-secret-key-32-characters

    services:
      postgres:
        image: timescale/timescaledb:2.16.1-pg16
        env:
          POSTGRES_USER: infrawatch_user
          POSTGRES_PASSWORD: infrawatch_secure_password_2026
          POSTGRES_DB: infrawatch_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infrawatch_user -d infrawatch_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Cache dependencies
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync --frozen --all-extras --group dev

      - name: Prepare database & verify readiness
        run: |
          sudo systemctl stop postgresql.service || true
          sudo systemctl disable postgresql.service || true
          which pg_isready || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U infrawatch_user -d infrawatch_db; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Start server
        run: |
          uv run uvicorn src.main:create_app --factory --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 4

      - name: Health check
        run: |
          for i in {1..15}; do
            if curl -sf http://127.0.0.1:8000/api/live; then
              echo "Server is live!"
              break
            fi
            echo "Waiting for server... ($i/15)"
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/live | jq -e '.status == "alive"'
          curl -sf http://127.0.0.1:8000/api/health | jq -e '.status == "healthy" or .status == "degraded" or .service == "infrawatch-api"'

      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi
