user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Formato de log detalhado
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Otimizações de Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream para a API FastAPI apenas (removido infrawatch_frontend - two-tier eliminad)
    upstream infrawatch_api {
        server infrawatch-api:8000;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # Servidor HTTP (Porta 80) - Redirecionamento permanente para HTTPS & ACME
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Cabeçalhos de Segurança Globais
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Endpoint de Health Check do Gateway na porta 80
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Rota de desafio ACME (certbot webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirecionamento Permanente HTTP 301 para HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # Servidor HTTPS Seguro (Porta 443) - Terminação TLS, SPA e Proxy API
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost;

        # Terminação HTTPS com TLS 1.2/1.3 e HSTS
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Cabeçalhos de Segurança Globais (HTTPS)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Endpoint de Health Check do Gateway na porta 443
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # ----------------------------------------------------------------------
        # 1. Rotas de Streaming SSE em Tempo Real (Buffering estritamente OFF)
        # ----------------------------------------------------------------------
        location ~ ^/api/v1/(events/stream|system/backup/events)$ {
            proxy_pass http://infrawatch_api;
            proxy_http_version 1.1;

            # Desativacao estrita de buffer para transmissao instantanea SSE
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Cabeçalhos SSE
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Accel-Buffering no;

            # Timeouts longos para manter conexoes SSE abertas (24h)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;
        }

        # ----------------------------------------------------------------------
        # 2. Rotas de API REST, Documentacao Swagger e OpenAPI
        # ----------------------------------------------------------------------
        location ~ ^/(api|docs|redoc|openapi\.json) {
            proxy_pass http://infrawatch_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Suporte a WebSockets caso necessario
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ----------------------------------------------------------------------
        # 3. Frontend SPA (Serviço Direto - sem proxy duplo)
        # ----------------------------------------------------------------------
        root /usr/share/nginx/html;
        index index.html;

        # Assets estaticos com cache longo (hashes imutaveis do Vite)
        location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Index.html sem cache para garantir atualizacoes imediatas de versao
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files /index.html =404;
        }

        # Fallback SPA (Single Page Application) para o React Router
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Tratamento de erro 404 redirecionando para index.html
        error_page 404 /index.html;
    }
}
