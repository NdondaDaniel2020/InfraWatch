user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Formato de log detalhado
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Otimizações de Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstreams para os serviços internos do Docker Compose
    upstream infrawatch_api {
        server infrawatch-api:8000;
        keepalive 32;
    }

    upstream infrawatch_frontend {
        server infrawatch-frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # Cabeçalhos de Segurança Globais
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Endpoint de Health Check do Gateway
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # ----------------------------------------------------------------------
        # 1. Rotas de Streaming SSE em Tempo Real (Buffering estritamente OFF)
        # ----------------------------------------------------------------------
        location ~ ^/api/v1/(events/stream|system/backup/events)$ {
            proxy_pass http://infrawatch_api;
            proxy_http_version 1.1;

            # Desativação estrita de buffer para transmissão instantânea SSE
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Cabeçalhos SSE
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Accel-Buffering no;

            # Timeouts longos para manter conexões SSE abertas (24h)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;
        }

        # ----------------------------------------------------------------------
        # 2. Rotas de API REST, Documentação Swagger e OpenAPI
        # ----------------------------------------------------------------------
        location ~ ^/(api|docs|redoc|openapi\.json) {
            proxy_pass http://infrawatch_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Suporte a WebSockets caso necessário
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ----------------------------------------------------------------------
        # 3. Frontend SPA (Telas do NOC, Dashboard, TV Wallboard, etc.)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://infrawatch_frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
